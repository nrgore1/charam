# /etc/nginx/sites-available/charam.org
# Serves the static export from `npm run build` (the ./out directory).
# Run certbot after DNS resolves; it will add the SSL server block.
server {
    listen 80;
    listen [::]:80;
    server_name charam.org www.charam.org;

    root /var/www/charam;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long cache for hashed Next.js assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
